name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: testing
          POSTGRES_DB: agentverse_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_DEBUG: "false"
      PYTHONPATH: backend
      REDIS_URL: ""
      QDRANT_URL: ""
      TEST_POSTGRES_URL: postgresql+asyncpg://postgres:testing@localhost:5432/agentverse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
      - run: ruff check backend/app backend/runner backend/scripts backend/tests
      - run: pip check
      - run: pip-audit -r backend/requirements.txt --no-deps
      - run: docker build -t agentverse-backend backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npx tsc --noEmit && npm run build
        working-directory: frontend
