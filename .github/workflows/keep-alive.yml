name: Manual backend availability check
on:
  workflow_dispatch:
    inputs:
      health_url:
        description: Full backend HTTPS health URL
        required: true
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check health
        env:
          HEALTH_URL: ${{ inputs.health_url }}
        run: curl --proto '=https' --fail --max-time 90 "$HEALTH_URL"
